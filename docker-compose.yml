services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bello_alerta
      POSTGRES_USER: bello
      POSTGRES_PASSWORD: bello
    ports:
      - "5432:5432"
    volumes:
      - bello_alerta_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run seed && npm start"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://bello:bello@db:5432/bello_alerta
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - db
volumes:
  bello_alerta_pg:
